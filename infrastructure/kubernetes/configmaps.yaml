apiVersion: v1
kind: ConfigMap
metadata:
  name: pricebrain-config
  namespace: pricebrain
data:
  SPRING_PROFILES_ACTIVE: "production"
  EUREKA_SERVER: "http://service-registry:8761/eureka"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.pricebrain-infra.svc.cluster.local:9092"
  DATABASE_HOST: "postgres-primary.pricebrain-infra.svc.cluster.local"
  DATABASE_PORT: "5432"
  REDIS_HOST: "redis.pricebrain-infra.svc.cluster.local"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: pricebrain
data:
  RATE_LIMIT_REQUESTS_PER_SECOND: "100"
  RATE_LIMIT_BURST_CAPACITY: "200"
  CORS_ALLOWED_ORIGINS: "https://pricebrain.com,https://www.pricebrain.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: pricebrain
data:
  JWT_ACCESS_TOKEN_EXPIRY: "3600"
  JWT_REFRESH_TOKEN_EXPIRY: "604800"
  PASSWORD_BCRYPT_STRENGTH: "12"
  LOGIN_RATE_LIMIT_ATTEMPTS: "5"
  LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
  ACCOUNT_LOCK_MAX_ATTEMPTS: "5"
  ACCOUNT_LOCK_DURATION_MINUTES: "30"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: pricebrain-infra
data:
  PROMETHEUS_RETENTION_DAYS: "15"
  GRAFANA_ADMIN_PASSWORD: "admin"
  JAEGER_SAMPLER_TYPE: "probabilistic"
  JAEGER_SAMPLER_PARAM: "0.1"
