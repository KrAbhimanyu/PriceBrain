apiVersion: v1
kind: Secret
metadata:
  name: pricebrain-secrets
  namespace: pricebrain
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:changeme@postgres:5432/pricebrain"
  REDIS_URL: "redis://redis:6379"
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  OPENAI_API_KEY: ""
  RESEND_API_KEY: ""
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: pricebrain-postgres
  namespace: pricebrain
type: Opaque
stringData:
  postgres-password: "changeme"
  postgres-user: "postgres"
  postgres-db: "pricebrain"
