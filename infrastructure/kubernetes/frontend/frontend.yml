apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricebrain-web
  namespace: pricebrain
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pricebrain-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pricebrain-web
    spec:
      containers:
        - name: frontend
          image: pricebrain/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.pricebrain.com"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pricebrain-web-svc
  namespace: pricebrain
spec:
  selector:
    app: pricebrain-web
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pricebrain-web-hpa
  namespace: pricebrain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pricebrain-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
