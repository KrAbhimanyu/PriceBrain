version: '3.9'

services:
  # ============================================
  # SERVICE REGISTRY (Eureka)
  # ============================================
  service-registry:
    image: ghcr.io/pricebrain/service-registry:1.0.0-SNAPSHOT
    container_name: pricebrain-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_INSTANCE_HOSTNAME=localhost
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pricebrain-network

  # ============================================
  # CONFIG SERVER
  # ============================================
  config-server:
    image: ghcr.io/pricebrain/config-server:1.0.0-SNAPSHOT
    container_name: pricebrain-config
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/pricebrain/config-repo
      - SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT-LABEL=main
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pricebrain-network

  # ============================================
  # API GATEWAY
  # ============================================
  api-gateway:
    image: ghcr.io/pricebrain/api-gateway:1.0.0-SNAPSHOT
    container_name: pricebrain-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://service-registry:8761/eureka
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=pricebrain-redis
    depends_on:
      - service-registry
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pricebrain-network

  # ============================================
  # AUTH SERVICE
  # ============================================
  auth-service:
    image: ghcr.io/pricebrain/auth-service:1.0.0-SNAPSHOT
    container_name: pricebrain-auth
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://service-registry:8761/eureka
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=pricebrain-db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=pricebrain-redis
      - JWT_SECRET=auth-jwt-secret-key-for-pricebrain-local-dev
    depends_on:
      - postgres
      - redis
    networks:
      - pricebrain-network

  # ============================================
  # USER SERVICE
  # ============================================
  user-service:
    image: ghcr.io/pricebrain/user-service:1.0.0-SNAPSHOT
    container_name: pricebrain-user
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://service-registry:8761/eureka
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=pricebrain-db
    depends_on:
      - postgres
    networks:
      - pricebrain-network

  # ============================================
  # PRODUCT SERVICE
  # ============================================
  product-service:
    image: ghcr.io/pricebrain/product-service:1.0.0-SNAPSHOT
    container_name: pricebrain-product
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://service-registry:8761/eureka
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=pricebrain-db
    depends_on:
      - postgres
    networks:
      - pricebrain-network

  # ============================================
  # ORDER SERVICE
  # ============================================
  order-service:
    image: ghcr.io/pricebrain/order-service:1.0.0-SNAPSHOT
    container_name: pricebrain-order
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://service-registry:8761/eureka
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=pricebrain-db
    depends_on:
      - postgres
    networks:
      - pricebrain-network

  # ============================================
  # AI SERVICE
  # ============================================
  ai-service:
    image: ghcr.io/pricebrain/ai-service:1.0.0-SNAPSHOT
    container_name: pricebrain-ai
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_CLIENT_SERVICE-URL_DEFAULTZONE=http://service-registry:8761/eureka
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - mongodb
    networks:
      - pricebrain-network

  # ============================================
  # DATABASES
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: pricebrain-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pricebrain-db
      - POSTGRES_MULTIPLE_DATABASES=pricebrain_auth,pricebrain_users,pricebrain_products,pricebrain_orders
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pricebrain-network

  mongodb:
    image: mongo:7
    container_name: pricebrain-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=pricebrain-mongo
      - MONGO_INITDB_DATABASE=pricebrain_ai
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pricebrain-network

  redis:
    image: redis:7-alpine
    container_name: pricebrain-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass pricebrain-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pricebrain-redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pricebrain-network

  # ============================================
  # KAFKA & ZOOKEEPER
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pricebrain-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pricebrain-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pricebrain-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pricebrain-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pricebrain-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - pricebrain-network

  # ============================================
  # MONITORING STACK
  # ============================================
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: pricebrain-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - pricebrain-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: pricebrain-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=pricebrain
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - pricebrain-network

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: pricebrain-jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - pricebrain-network

  # ============================================
  # MAIL (Development)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: pricebrain-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - pricebrain-network

# ============================================
# NETWORKS
# ============================================
networks:
  pricebrain-network:
    driver: bridge

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  prometheus-data:
  grafana-data:
