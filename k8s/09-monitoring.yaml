---
# Monitoring Stack - PriceBrain
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: web
  type: ClusterIP
---
# Prometheus Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
      - job_name: 'pricebrain-backend'
        static_configs:
          - targets: ['backend.pricebrain.svc.cluster.local:80']
        metrics_path: /api/health
      - job_name: 'pricebrain-frontend'
        static_configs:
          - targets: ['frontend.pricebrain.svc.cluster.local:80']
---
# Alerting Rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: pricebrain-alerts
        rules:
          - alert: HighCPUUsage
            expr: cpu_usage_percent > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "CPU usage is above 80% for 5 minutes"
          
          - alert: HighMemoryUsage
            expr: memory_usage_percent > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Memory usage is above 85% for 5 minutes"
          
          - alert: PodNotReady
            expr: kube_pod_status_ready{namespace="pricebrain"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Pod not ready"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is not ready"
          
          - alert: PodRestarting
            expr: rate(kube_pod_container_status_restarts_total{namespace="pricebrain"}[5m]) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Pod restarting frequently"
              description: "Pod {{ $labels.pod }} is restarting frequently"
          
          - alert: BackendDown
            expr: up{job="pricebrain-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Backend is down"
              description: "PriceBrain backend is not responding"
          
          - alert: FrontendDown
            expr: up{job="pricebrain-frontend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Frontend is down"
              description: "PriceBrain frontend is not responding"
          
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High error rate"
              description: "HTTP 5xx error rate is above 5%"
---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: web
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitoring-secrets
                  key: grafana-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:3000"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 80
      targetPort: 3000
      name: web
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Grafana Datasources
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true
---
# Grafana Dashboards Config
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboardproviders.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-definitions
  namespace: monitoring
data:
  pricebrain-overview.json: |
    {
      "dashboard": {
        "title": "PriceBrain Overview",
        "uid": "pricebrain-overview",
        "panels": [
          {
            "title": "Service Status",
            "type": "stat",
            "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
            "targets": [
              {"expr": "up{job=~\"pricebrain-.*\"}"}
            ]
          },
          {
            "title": "Request Rate",
            "type": "graph",
            "gridPos": {"x": 6, "y": 0, "w": 12, "h": 4},
            "targets": [
              {"expr": "rate(http_requests_total[5m])"}
            ]
          },
          {
            "title": "CPU Usage",
            "type": "graph",
            "gridPos": {"x": 0, "y": 4, "w": 8, "h": 4},
            "targets": [
              {"expr": "rate(container_cpu_usage_seconds_total{namespace=\"pricebrain\"}[5m])"}
            ]
          },
          {
            "title": "Memory Usage",
            "type": "graph",
            "gridPos": {"x": 8, "y": 4, "w": 8, "h": 4},
            "targets": [
              {"expr": "container_memory_usage_bytes{namespace=\"pricebrain\"}"}
            ]
          }
        ]
      }
    }
---
# AlertManager Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-alerts'
    
    receivers:
      - name: 'default-receiver'
        webhook_configs:
          - url: 'http://backend-health.pricebrain.svc.cluster.local:3001/api/webhook'
            send_resolved: true
    
      - name: 'critical-alerts'
        webhook_configs:
          - url: 'http://backend-health.pricebrain.svc.cluster.local:3001/api/webhook'
            send_resolved: true
    
      - name: 'warning-alerts'
        webhook_configs:
          - url: 'http://backend-health.pricebrain.svc.cluster.local:3001/api/webhook'
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          ports:
            - containerPort: 9093
              name: web
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
      name: web
  type: ClusterIP
---
# Monitoring Secrets
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: monitoring
type: Opaque
stringData:
  grafana-password: "admin123"
  alertmanager-slack-webhook: ""
  alertmanager-smtp-password: ""
---
# Application Logging (ELK Stack config placeholder)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-logging-config
  namespace: pricebrain
data:
  fluentd.conf: |
    <source>
      @type tail
      @id input-tail-access
      path /var/log/nginx/access.log
      pos_file /var/log/fluentd/access.log.pos
      tag nginx.access
      <parse>
        @type nginx
      </parse>
    </source>
    <source>
      @type tail
      @id input-tail-error
      path /var/log/nginx/error.log
      pos_file /var/log/fluentd/error.log.pos
      tag nginx.error
      <parse>
        @type nginx
      </parse>
    </source>
    <match **>
      @type stdout
    </match>
---
# Health Check Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-check-config
  namespace: pricebrain
data:
  healthz: |
    # Health Check Endpoints
    # Backend: GET /api/health
    # Frontend: GET /
    # PostgreSQL: Port 5432
    # Redis: Port 6379
    # Elasticsearch: GET http://elasticsearch:9200/_cluster/health
---
# Backend Health Endpoint
apiVersion: v1
kind: Service
metadata:
  name: backend-health
  namespace: pricebrain
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3001"
    prometheus.io/path: "/api/health"
spec:
  selector:
    app: backend
    tier: api
  ports:
    - port: 3001
      targetPort: 3001
      name: health
  type: ClusterIP
