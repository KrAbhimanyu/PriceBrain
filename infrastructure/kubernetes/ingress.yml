apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pricebrain-ingress
  namespace: pricebrain
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - pricebrain.com
        - api.pricebrain.com
        - admin.pricebrain.com
      secretName: pricebrain-tls
  rules:
    - host: pricebrain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pricebrain-web-svc
                port:
                  number: 80
    - host: api.pricebrain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pricebrain-api-svc
                port:
                  number: 80
    - host: admin.pricebrain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pricebrain-web-svc
                port:
                  number: 80
            path: /admin
            backend:
              service:
                name: pricebrain-web-svc
                port:
                  number: 80
