global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  - "alerts.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Service Registry
  - job_name: 'eureka'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['service-registry:8761']
    scrape_interval: 30s

  # Config Server
  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['config-server:8888']
    scrape_interval: 30s

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
    scrape_interval: 10s

  # Business Microservices
  - job_name: 'microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          # Core services
          - 'user-service:8082'
          - 'auth-service:8081'
          - 'product-service:8083'
          - 'order-service:8084'
          - 'cart-service:8086'
          - 'payment-service:8085'
          - 'notification-service:8086'
          - 'ai-service:8087'
          - 'analytics-service:8088'
          - 'search-service:8089'
          - 'inventory-service:8090'
          - 'seller-service:8091'
          - 'review-service:8092'
          - 'wishlist-service:8093'
    scrape_interval: 15s
    scrape_timeout: 10s
