# NOTE: This file contains template secrets
# In production, use external secrets management (AWS Secrets Manager, HashiCorp Vault, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: pricebrain-secrets
  namespace: pricebrain
type: Opaque
stringData:
  # JWT Configuration
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET"
  
  # Database Credentials
  DB_USERNAME: "postgres"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis Credentials
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # MongoDB Credentials
  MONGODB_ROOT_USERNAME: "mongoadmin"
  MONGODB_ROOT_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Mail Configuration
  MAIL_USERNAME: "noreply@pricebrain.com"
  MAIL_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # External API Keys
  OPENAI_API_KEY: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: v1
kind: Secret
metadata:
  name: pricebrain-tls-cert
  namespace: pricebrain
type: kubernetes.io/tls
stringData:
  # In production, use cert-manager to automatically provision TLS certificates
  tls.crt: "BASE64_ENCODED_CERTIFICATE"
  tls.key: "BASE64_ENCODED_PRIVATE_KEY"
